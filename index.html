<!doctype html>
<html lang="en" data-ui-style="custom_three">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var savedStyle = localStorage.getItem('pop_ui_style_v2') || 'custom_three';
        document.documentElement.setAttribute('data-ui-style', savedStyle);
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) {}
    </script>
    <title>POP — Claymorphism Music Player</title>
    <meta name="description" content="Claymorphism music player featuring dark mode, responsive media controls, song selection, and generic playlist blocks." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
